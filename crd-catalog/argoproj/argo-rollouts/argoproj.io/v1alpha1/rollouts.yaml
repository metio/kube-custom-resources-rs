                controllerPause:
                  description: "ControllerPause indicates the controller has paused the rollout. It is set to true when\nthe controller adds a pause condition. This field helps to discern the scenario where a\nrollout was resumed after being paused by the controller (e.g. via the plugin). In that\nsituation, the pauseConditions would have been cleared , but controllerPause would still be\nset to true."
                  type: "boolean"
                currentPodHash:
                  description: "CurrentPodHash the hash of the current pod template"
                  type: "string"
                currentStepHash:
                  description: "CurrentStepHash the hash of the current list of steps for the current strategy. This is used to detect when the\nlist of current steps change"
                  type: "string"
                currentStepIndex:
                  description: "CurrentStepIndex defines the current step of the rollout is on. If the current step index is null, the\ncontroller will execute the rollout."
                  format: "int32"
                  type: "integer"
                duration:
                  description: "Duration tracks timing information for the current rollout attempt"
                  properties:
                    completionStatus:
                      description: "CompletionStatus is the outcome of this rollout attempt. It is set as soon as the\noutcome becomes known, which may be before the attempt finishes (e.g. a rollback is\nclassified while it is still progressing). FinishedAt, not this field, is the\nterminal signal."
                      type: "string"
                    finishedAt:
                      description: "FinishedAt is when this rollout attempt reached its terminal state:\n(1) promoted and stable, (2) aborted, or (3) superseded.\nNil means the attempt is still in progress."
                      format: "date-time"
                      type: "string"
                    manualPauseStartedAt:
                      description: "ManualPauseStartedAt is when the current manual pause began (nil if not in manual pause)"
                      format: "date-time"
                      type: "string"
                    rolloutStartedAt:
                      description: "RolloutStartedAt is when the current rollout attempt started (StableRS diverged from CurrentPodHash)"
                      format: "date-time"
                      type: "string"
                    totalManualPauseDurationSeconds:
                      description: "TotalManualPauseDurationSeconds is the accumulated time spent in manual pauses, in seconds"
                      format: "int64"
                      type: "integer"
                  type: "object"
                message:
                  description: "Message provides details on why the rollout is in its current phase"
                  type: "string"
                observedGeneration:
                  description: "The generation observed by the rollout controller from metadata.generation"
                  type: "string"
                pauseConditions:
                  description: "PauseConditions is a list of reasons why rollout became automatically paused (e.g.\nCanaryPauseStep, BlueGreenPause, InconclusiveAnalysis). The items in this list are populated\nby the controller but are cleared by the user (e.g. plugin, argo-cd resume action) when they\nwish to unpause. If pause conditions is empty, but controllerPause is true, it indicates\nthe user manually unpaused the Rollout"
                  items:
                    description: "PauseCondition the reason for a pause and when it started"
                    properties:
                      reason:
                        description: "PauseReason reasons that the rollout can pause"
                        type: "string"
                      startTime:
                        format: "date-time"
                        type: "string"
                    required:
                      - "reason"
                      - "startTime"
                    type: "object"
                  type: "array"
                phase:
                  description: "Phase is the rollout phase. Clients should only rely on the value if status.observedGeneration equals metadata.generation"
                  type: "string"
                promoteFull:
                  description: "PromoteFull indicates if the rollout should perform a full promotion, skipping analysis and pauses."
                  type: "boolean"
                readyReplicas:
                  description: "Total number of ready pods targeted by this rollout."
                  format: "int32"
                  type: "integer"
                replicas:
                  description: "Total number of non-terminated pods targeted by this rollout (their labels match the selector)."
                  format: "int32"
                  type: "integer"
                restartedAt:
                  description: "RestartedAt indicates last time a Rollout was restarted"
                  format: "date-time"
                  type: "string"
                selector:
                  description: "Selector that identifies the pods that are receiving active traffic"
                  type: "string"
                stableRS:
                  description: "StableRS indicates the replicaset that has successfully rolled out"
                  type: "string"
                updatedReplicas:
                  description: "Total number of non-terminated pods targeted by this rollout that have the desired template spec."
                  format: "int32"
                  type: "integer"
                workloadObservedGeneration:
                  description: "The generation of referenced workload observed by the rollout controller"
                  type: "string"
              type: "object"
          required:
            - "spec"
          type: "object"
      served: true
      storage: true
      subresources:
        scale:
          labelSelectorPath: ".status.selector"
          specReplicasPath: ".spec.replicas"
          statusReplicasPath: ".status.HPAReplicas"
        status: {}
