apiVersion: "apiextensions.k8s.io/v1"
kind: "CustomResourceDefinition"
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: "v0.19.0"
  name: "rollouts.argoproj.io"
spec:
  group: "argoproj.io"
  names:
    kind: "Rollout"
    listKind: "RolloutList"
    plural: "rollouts"
    shortNames:
      - "ro"
    singular: "rollout"
  scope: "Namespaced"
  versions:
    - additionalPrinterColumns:
        - description: "Number of desired pods"
          jsonPath: ".spec.replicas"
          name: "Desired"
          type: "integer"
        - description: "Total number of non-terminated pods targeted by this rollout"
          jsonPath: ".status.replicas"
          name: "Current"
          type: "integer"
        - description: "Total number of non-terminated pods targeted by this rollout that have the desired template spec"
          jsonPath: ".status.updatedReplicas"
          name: "Up-to-date"
          type: "integer"
        - description: "Total number of available pods (ready for at least minReadySeconds) targeted by this rollout"
          jsonPath: ".status.availableReplicas"
          name: "Available"
          type: "integer"
        - description: "Time since resource was created"
          jsonPath: ".metadata.creationTimestamp"
          name: "Age"
          type: "date"
      name: "v1alpha1"
      schema:
        openAPIV3Schema:
          description: "Rollout is a specification for a Rollout resource"
          properties:
            apiVersion:
              description: "APIVersion defines the versioned schema of this representation of an object.\nServers should convert recognized schemas to the latest internal value, and\nmay reject unrecognized values.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources"
              type: "string"
            kind:
              description: "Kind is a string value representing the REST resource this object represents.\nServers may infer this from the endpoint the client submits requests to.\nCannot be updated.\nIn CamelCase.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds"
              type: "string"
            metadata:
              type: "object"
            spec:
              description: "RolloutSpec is the spec for a Rollout resource"
              properties:
                analysis:
                  description: "Analysis configuration for the analysis runs to retain"
                  properties:
                    successfulRunHistoryLimit:
                      description: "SuccessfulRunHistoryLimit limits the number of old successful analysis runs and experiments to be retained in a history"
                      format: "int32"
                      type: "integer"
                    unsuccessfulRunHistoryLimit:
                      description: "UnsuccessfulRunHistoryLimit limits the number of old unsuccessful analysis runs and experiments to be retained in a history.\nStages for unsuccessful: \"Error\", \"Failed\", \"Inconclusive\""
                      format: "int32"
                      type: "integer"
                  type: "object"
                minReadySeconds:
                  description: "Minimum number of seconds for which a newly created pod should be ready\nwithout any of its container crashing, for it to be considered available.\nDefaults to 0 (pod will be considered available as soon as it is ready)"
                  format: "int32"
                  type: "integer"
                paused:
                  description: "Paused pauses the rollout at its current step."
                  type: "boolean"
                progressDeadlineAbort:
                  description: "ProgressDeadlineAbort is whether to abort the update when ProgressDeadlineSeconds\nis exceeded."
                  type: "boolean"
                progressDeadlineSeconds:
                  description: "ProgressDeadlineSeconds The maximum time in seconds for a rollout to\nmake progress before it is considered to be failed. Argo Rollouts will\ncontinue to process failed rollouts and a condition with a\nProgressDeadlineExceeded reason will be surfaced in the rollout status.\nNote that progress will not be estimated during the time a rollout is paused.\nDefaults to 600s."
                  format: "int32"
                  type: "integer"
                replicas:
                  description: "Number of desired pods. This is a pointer to distinguish between explicit\nzero and not specified. Defaults to 1."
                  format: "int32"
                  type: "integer"
                restartAt:
                  description: "RestartAt indicates when all the pods of a Rollout should be restarted"
                  format: "date-time"
                  type: "string"
                revisionHistoryLimit:
                  description: "The number of old ReplicaSets to retain. If unspecified, will retain 10 old ReplicaSets"
                  format: "int32"
                  type: "integer"
                rollbackWindow:
                  description: "The window in which a rollback will be fast tracked (fully promoted)"
                  properties:
                    revisions:
                      format: "int32"
                      type: "integer"
                  type: "object"
                selector:
                  description: "Label selector for pods. Existing ReplicaSets whose pods are\nselected by this will be the ones affected by this rollout.\nIt must match the pod template's labels."
                  properties:
                    matchExpressions:
                      description: "matchExpressions is a list of label selector requirements. The requirements are ANDed."
                      items:
                        description: "A label selector requirement is a selector that contains values, a key, and an operator that\nrelates the key and values."
                        properties:
                          key:
                            description: "key is the label key that the selector applies to."
                            type: "string"
                          operator:
                            description: "operator represents a key's relationship to a set of values.\nValid operators are In, NotIn, Exists and DoesNotExist."
                            type: "string"
                          values:
                            description: "values is an array of string values. If the operator is In or NotIn,\nthe values array must be non-empty. If the operator is Exists or DoesNotExist,\nthe values array must be empty. This array is replaced during a strategic\nmerge patch."
                            items:
                              type: "string"
                            type: "array"
                            x-kubernetes-list-type: "atomic"
                        required:
                          - "key"
                          - "operator"
                        type: "object"
                      type: "array"
                      x-kubernetes-list-type: "atomic"
                    matchLabels:
                      additionalProperties:
                        type: "string"
                      description: "matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels\nmap is equivalent to an element of matchExpressions, whose key field is \"key\", the\noperator is \"In\", and the values array contains only \"value\". The requirements are ANDed."
                      type: "object"
                  type: "object"
                  x-kubernetes-map-type: "atomic"
                  x-kubernetes-validations:
                    - message: ".spec.selector is immutable"
                      rule: "self == oldSelf"
                strategy:
                  description: "The deployment strategy to use to replace existing pods with new ones."
                  properties:
                    blueGreen:
                      description: "BlueGreenStrategy defines parameters for Blue Green deployment"
                      properties:
                        abortScaleDownDelaySeconds:
                          description: "AbortScaleDownDelaySeconds adds a delay in second before scaling down the preview replicaset\nif update is aborted. 0 means not to scale down.\nDefault is 30 second"
                          format: "int32"
                          type: "integer"
                        activeMetadata:
                          description: "ActiveMetadata specify labels and annotations which will be attached to the active pods for\nthe duration which they act as a active pod, and will be removed after"
                          properties:
                            annotations:
                              additionalProperties:
                                type: "string"
                              description: "Annotations additional annotations to add to the experiment"
                              type: "object"
                            labels:
                              additionalProperties:
                                type: "string"
                              description: "Labels Additional labels to add to the experiment"
                              type: "object"
                          type: "object"
                        activeService:
                          description: "Name of the service that the rollout modifies as the active service."
                          type: "string"
                        antiAffinity:
                          description: "AntiAffinity enables anti-affinity rules for Blue Green deployment"
                          properties:
                            preferredDuringSchedulingIgnoredDuringExecution:
                              description: "PreferredDuringSchedulingIgnoredDuringExecution defines the weight of the anti-affinity injection"
                              properties:
                                weight:
                                  description: "Weight associated with matching the corresponding podAffinityTerm, in the range 1-100."
                                  format: "int32"
                                  type: "integer"
                              required:
                                - "weight"
                              type: "object"
                            requiredDuringSchedulingIgnoredDuringExecution:
                              description: "RequiredDuringSchedulingIgnoredDuringExecution defines inter-pod scheduling rule to be RequiredDuringSchedulingIgnoredDuringExecution"
                              type: "object"
                          type: "object"
                        autoPromotionEnabled:
                          description: "AutoPromotionEnabled indicates if the rollout should automatically promote the new ReplicaSet\nto the active service or enter a paused state. If not specified, the default value is true."
                          type: "boolean"
                        autoPromotionSeconds:
                          description: "AutoPromotionSeconds is a duration in seconds in which to delay auto-promotion (default: 0).\nThe countdown begins after the preview ReplicaSet have reached full availability.\nThis option is ignored if autoPromotionEnabled is set to false."
                          format: "int32"
                          type: "integer"
                        maxUnavailable:
                          anyOf:
                            - type: "integer"
                            - type: "string"
                          description: "MaxUnavailable The maximum number of pods that can be unavailable during a restart operation.\nDefaults to 25% of total replicas."
                          x-kubernetes-int-or-string: true
                        postPromotionAnalysis:
                          description: "PostPromotionAnalysis configuration to run analysis after a selector switch"
                          properties:
                            analysisRunMetadata:
                              description: "AnalysisRunMetadata labels and annotations that will be added to the AnalysisRuns"
                              properties:
                                annotations:
                                  additionalProperties:
                                    type: "string"
                                  description: "Annotations additional annotations to add to the AnalysisRun"
                                  type: "object"
                                labels:
                                  additionalProperties:
                                    type: "string"
                                  description: "Labels Additional labels to add to the AnalysisRun"
                                  type: "object"
                              type: "object"
                            args:
                              description: "Args the arguments that will be added to the AnalysisRuns"
                              items:
                                description: "AnalysisRunArgument argument to add to analysisRun"
                                properties:
                                  name:
                                    description: "Name argument name"
                                    type: "string"
                                  value:
                                    description: "Value a hardcoded value for the argument. This field is a one of field with valueFrom"
                                    type: "string"
                                  valueFrom:
                                    description: "ValueFrom A reference to where the value is stored. This field is a one of field with valueFrom"
                                    properties:
                                      fieldRef:
                                        description: "FieldRef"
                                        properties:
                                          fieldPath:
                                            description: "Required: Path of the field to select in the specified API version"
                                            type: "string"
                                        required:
                                          - "fieldPath"
                                        type: "object"
                                      podTemplateHashValue:
                                        description: "PodTemplateHashValue gets the value from one of the children ReplicaSet's Pod Template Hash"
                                        type: "string"
                                    type: "object"
                                required:
                                  - "name"
                                type: "object"
                              type: "array"
                            dryRun:
                              description: "DryRun object contains the settings for running the analysis in Dry-Run mode"
                              items:
                                description: "DryRun defines the settings for running the analysis in Dry-Run mode."
                                properties:
                                  metricName:
                                    description: "Name of the metric which needs to be evaluated in the Dry-Run mode. Wildcard '*' is supported and denotes all\nthe available metrics."
                                    type: "string"
                                required:
                                  - "metricName"
                                type: "object"
                              type: "array"
                            measurementRetention:
                              description: "MeasurementRetention object contains the settings for retaining the number of measurements during the analysis"
                              items:
                                description: "MeasurementRetention defines the settings for retaining the number of measurements during the analysis."
                                properties:
                                  limit:
                                    description: "Limit is the maximum number of measurements to be retained for this given metric."
                                    format: "int32"
                                    type: "integer"
                                  metricName:
                                    description: "MetricName is the name of the metric on which this retention policy should be applied."
                                    type: "string"
                                required:
                                  - "limit"
                                  - "metricName"
                                type: "object"
                              type: "array"
                            templates:
                              description: "Templates reference to a list of analysis templates to combine for an AnalysisRun"
                              items:
                                properties:
                                  clusterScope:
                                    description: "Whether to look for the templateName at cluster scope or namespace scope"
                                    type: "boolean"
                                  templateName:
                                    description: "TemplateName name of template to use in AnalysisRun"
                                    type: "string"
                                type: "object"
                              type: "array"
                          type: "object"
                        prePromotionAnalysis:
                          description: "PrePromotionAnalysis configuration to run analysis before a selector switch"
                          properties:
                            analysisRunMetadata:
                              description: "AnalysisRunMetadata labels and annotations that will be added to the AnalysisRuns"
                              properties:
                                annotations:
                                  additionalProperties:
                                    type: "string"
                                  description: "Annotations additional annotations to add to the AnalysisRun"
                                  type: "object"
                                labels:
                                  additionalProperties:
                                    type: "string"
                                  description: "Labels Additional labels to add to the AnalysisRun"
                                  type: "object"
                              type: "object"
                            args:
                              description: "Args the arguments that will be added to the AnalysisRuns"
                              items:
                                description: "AnalysisRunArgument argument to add to analysisRun"
                                properties:
                                  name:
                                    description: "Name argument name"
                                    type: "string"
                                  value:
                                    description: "Value a hardcoded value for the argument. This field is a one of field with valueFrom"
                                    type: "string"
                                  valueFrom:
                                    description: "ValueFrom A reference to where the value is stored. This field is a one of field with valueFrom"
                                    properties:
                                      fieldRef:
                                        description: "FieldRef"
                                        properties:
                                          fieldPath:
                                            description: "Required: Path of the field to select in the specified API version"
                                            type: "string"
                                        required:
                                          - "fieldPath"
                                        type: "object"
                                      podTemplateHashValue:
                                        description: "PodTemplateHashValue gets the value from one of the children ReplicaSet's Pod Template Hash"
                                        type: "string"
                                    type: "object"
                                required:
                                  - "name"
                                type: "object"
                              type: "array"
                            dryRun:
                              description: "DryRun object contains the settings for running the analysis in Dry-Run mode"
                              items:
                                description: "DryRun defines the settings for running the analysis in Dry-Run mode."
                                properties:
                                  metricName:
                                    description: "Name of the metric which needs to be evaluated in the Dry-Run mode. Wildcard '*' is supported and denotes all\nthe available metrics."
                                    type: "string"
                                required:
                                  - "metricName"
                                type: "object"
                              type: "array"
                            measurementRetention:
                              description: "MeasurementRetention object contains the settings for retaining the number of measurements during the analysis"
                              items:
                                description: "MeasurementRetention defines the settings for retaining the number of measurements during the analysis."
                                properties:
                                  limit:
                                    description: "Limit is the maximum number of measurements to be retained for this given metric."
                                    format: "int32"
                                    type: "integer"
                                  metricName:
                                    description: "MetricName is the name of the metric on which this retention policy should be applied."
                                    type: "string"
                                required:
                                  - "limit"
                                  - "metricName"
                                type: "object"
                              type: "array"
                            templates:
                              description: "Templates reference to a list of analysis templates to combine for an AnalysisRun"
                              items:
                                properties:
                                  clusterScope:
                                    description: "Whether to look for the templateName at cluster scope or namespace scope"
                                    type: "boolean"
                                  templateName:
                                    description: "TemplateName name of template to use in AnalysisRun"
                                    type: "string"
                                type: "object"
                              type: "array"
                          type: "object"
                        previewMetadata:
                          description: "PreviewMetadata specify labels and annotations which will be attached to the preview pods for\nthe duration which they act as a preview pod, and will be removed after"
                          properties:
                            annotations:
                              additionalProperties:
                                type: "string"
                              description: "Annotations additional annotations to add to the experiment"
                              type: "object"
                            labels:
                              additionalProperties:
                                type: "string"
                              description: "Labels Additional labels to add to the experiment"
                              type: "object"
                          type: "object"
                        previewReplicaCount:
                          description: "PreviewReplicaCount is the number of replicas to run for the preview stack before the\nswitchover. Once the rollout is resumed the desired replicaset will be full scaled up before the switch occurs"
                          format: "int32"
                          type: "integer"
                        previewService:
                          description: "Name of the service that the rollout modifies as the preview service."
                          type: "string"
                        scaleDownDelayRevisionLimit:
                          description: "ScaleDownDelayRevisionLimit limits the number of old RS that can run at one time before getting scaled down"
                          format: "int32"
                          type: "integer"
                        scaleDownDelaySeconds:
                          description: "ScaleDownDelaySeconds adds a delay before scaling down the previous replicaset.\nIf omitted, the Rollout waits 30 seconds before scaling down the previous ReplicaSet.\nA minimum of 30 seconds is recommended to ensure IP table propagation across the nodes in\na cluster. See https://github.com/argoproj/argo-rollouts/issues/19#issuecomment-476329960 for\nmore information"
                          format: "int32"
                          type: "integer"
                      required:
                        - "activeService"
                      type: "object"
                    canary:
                      description: "CanaryStrategy defines parameters for a Replica Based Canary"
                      properties:
                        abortScaleDownDelaySeconds:
                          description: "AbortScaleDownDelaySeconds adds a delay in second before scaling down the canary pods when update\nis aborted for canary strategy with traffic routing (not applicable for basic canary).\n0 means canary pods are not scaled down.\nDefault is 30 seconds."
                          format: "int32"
                          type: "integer"
                        analysis:
                          description: "Analysis runs a separate analysisRun while all the steps execute. This is intended to be a continuous validation of the new ReplicaSet"
                          properties:
                            analysisRunMetadata:
                              description: "AnalysisRunMetadata labels and annotations that will be added to the AnalysisRuns"
                              properties:
                                annotations:
                                  additionalProperties:
                                    type: "string"
                                  description: "Annotations additional annotations to add to the AnalysisRun"
                                  type: "object"
                                labels:
                                  additionalProperties:
                                    type: "string"
                                  description: "Labels Additional labels to add to the AnalysisRun"
                                  type: "object"
                              type: "object"
                            args:
                              description: "Args the arguments that will be added to the AnalysisRuns"
                              items:
                                description: "AnalysisRunArgument argument to add to analysisRun"
                                properties:
                                  name:
                                    description: "Name argument name"
                                    type: "string"
                                  value:
                                    description: "Value a hardcoded value for the argument. This field is a one of field with valueFrom"
                                    type: "string"
                                  valueFrom:
                                    description: "ValueFrom A reference to where the value is stored. This field is a one of field with valueFrom"
                                    properties:
                                      fieldRef:
                                        description: "FieldRef"
                                        properties:
                                          fieldPath:
                                            description: "Required: Path of the field to select in the specified API version"
                                            type: "string"
                                        required:
                                          - "fieldPath"
                                        type: "object"
                                      podTemplateHashValue:
                                        description: "PodTemplateHashValue gets the value from one of the children ReplicaSet's Pod Template Hash"
                                        type: "string"
                                    type: "object"
                                required:
                                  - "name"
                                type: "object"
                              type: "array"
                            dryRun:
                              description: "DryRun object contains the settings for running the analysis in Dry-Run mode"
                              items:
                                description: "DryRun defines the settings for running the analysis in Dry-Run mode."
                                properties:
                                  metricName:
                                    description: "Name of the metric which needs to be evaluated in the Dry-Run mode. Wildcard '*' is supported and denotes all\nthe available metrics."
                                    type: "string"
                                required:
                                  - "metricName"
                                type: "object"
                              type: "array"
                            measurementRetention:
                              description: "MeasurementRetention object contains the settings for retaining the number of measurements during the analysis"
                              items:
                                description: "MeasurementRetention defines the settings for retaining the number of measurements during the analysis."
                                properties:
                                  limit:
                                    description: "Limit is the maximum number of measurements to be retained for this given metric."
                                    format: "int32"
                                    type: "integer"
                                  metricName:
                                    description: "MetricName is the name of the metric on which this retention policy should be applied."
                                    type: "string"
                                required:
                                  - "limit"
                                  - "metricName"
                                type: "object"
                              type: "array"
                            startingStep:
                              description: "StartingStep indicates which step the background analysis should start on\nIf not listed, controller defaults to 0"
                              format: "int32"
                              type: "integer"
                            templates:
                              description: "Templates reference to a list of analysis templates to combine for an AnalysisRun"
                              items:
                                properties:
                                  clusterScope:
                                    description: "Whether to look for the templateName at cluster scope or namespace scope"
                                    type: "boolean"
                                  templateName:
                                    description: "TemplateName name of template to use in AnalysisRun"
                                    type: "string"
                                type: "object"
                              type: "array"
                          type: "object"
                        antiAffinity:
                          description: "AntiAffinity enables anti-affinity rules for Canary deployment"
                          properties:
                            preferredDuringSchedulingIgnoredDuringExecution:
                              description: "PreferredDuringSchedulingIgnoredDuringExecution defines the weight of the anti-affinity injection"
                              properties:
                                weight:
                                  description: "Weight associated with matching the corresponding podAffinityTerm, in the range 1-100."
                                  format: "int32"
                                  type: "integer"
                              required:
                                - "weight"
                              type: "object"
                            requiredDuringSchedulingIgnoredDuringExecution:
                              description: "RequiredDuringSchedulingIgnoredDuringExecution defines inter-pod scheduling rule to be RequiredDuringSchedulingIgnoredDuringExecution"
                              type: "object"
                          type: "object"
                        canaryMetadata:
                          description: "CanaryMetadata specify labels and annotations which will be attached to the canary pods for\nthe duration which they act as a canary, and will be removed after"
                          properties:
                            annotations:
                              additionalProperties:
                                type: "string"
                              description: "Annotations additional annotations to add to the experiment"
                              type: "object"
                            labels:
                              additionalProperties:
                                type: "string"
                              description: "Labels Additional labels to add to the experiment"
                              type: "object"
                          type: "object"
                        canaryService:
                          description: "CanaryService holds the name of a service which selects pods with canary version and don't select any pods with stable version."
                          type: "string"
                        dynamicStableScale:
                          description: "DynamicStableScale is a traffic routing feature which dynamically scales the stable\nReplicaSet to minimize total pods which are running during an update. This is calculated by\nscaling down the stable as traffic is increased to canary. When disabled (the default behavior)\nthe stable ReplicaSet remains fully scaled to support instantaneous aborts."
                          type: "boolean"
                        maxSurge:
                          anyOf:
                            - type: "integer"
                            - type: "string"
                          description: "MaxSurge The maximum number of pods that can be scheduled above the original number of\npods.\nValue can be an absolute number (ex: 5) or a percentage of total pods at\nthe start of the update (ex: 10%). This can not be 0 if MaxUnavailable is 0.\nAbsolute number is calculated from percentage by rounding up.\nBy default, a value of 25% is used.\nExample: when this is set to 30%, the new RC can be scaled up by 30%\nimmediately when the rolling update starts. Once old pods have been killed,\nnew RC can be scaled up further, ensuring that total number of pods running\nat any time during the update is at most 130% of original pods."
                          x-kubernetes-int-or-string: true
                        maxUnavailable:
                          anyOf:
                            - type: "integer"
                            - type: "string"
                          description: "MaxUnavailable The maximum number of pods that can be unavailable during the update.\nValue can be an absolute number (ex: 5) or a percentage of total pods at the start of update (ex: 10%).\nAbsolute number is calculated from percentage by rounding down.\nThis can not be 0 if MaxSurge is 0.\nBy default, a fixed value of 25% is used.\nExample: when this is set to 30%, the old RC can be scaled down by 30%\nimmediately when the rolling update starts. Once new pods are ready, old RC\ncan be scaled down further, followed by scaling up the new RC, ensuring\nthat at least 70% of original number of pods are available at all times\nduring the update."
                          x-kubernetes-int-or-string: true
                        minPodsPerReplicaSet:
                          description: "Assuming the desired number of pods in a stable or canary ReplicaSet is not zero, then make sure it is at least\nMinPodsPerReplicaSet for High Availability. Only applicable for TrafficRoutedCanary"
                          format: "int32"
                          type: "integer"
                        pingPong:
                          description: "PingPongSpec holds the ping and pong services"
                          properties:
                            pingService:
                              description: "name of the ping service"
                              type: "string"
                            pongService:
                              description: "name of the pong service"
                              type: "string"
                          required:
                            - "pingService"
                            - "pongService"
                          type: "object"
                        replicaProgressThreshold:
                          description: "ReplicaProgressThreshold is the threhold number or percentage of pods that need to be available before a rollout promotion.\nDefaults to 100% of total replicas."
                          properties:
                            type:
                              description: "Type is used to specify whether the replica progress threshold is a percentage or a number. Required if replicaProgressThreshold is specified."
                              type: "string"
                            value:
                              description: "Value contains the user-specified value for when a Argo Rollouts can promote a canary to the next step.\nIf not satisfied, this value will be assumed to be 100% of the total desired replicas for the given next step.\nValue must also be greater than 0. Required."
                              format: "int32"
                              type: "integer"
                          required:
                            - "type"
                            - "value"
                          type: "object"
                        scaleDownDelayRevisionLimit:
                          description: "ScaleDownDelayRevisionLimit limits the number of old RS that can run at one time before getting scaled down"
                          format: "int32"
                          type: "integer"
                        scaleDownDelaySeconds:
                          description: "ScaleDownDelaySeconds adds a delay before scaling down the previous ReplicaSet when the\ncanary strategy is used with traffic routing (default 30 seconds). A delay in scaling down\nthe previous ReplicaSet is needed after switching the stable service selector to point to\nthe new ReplicaSet, in order to give time for traffic providers to re-target the new pods.\nThis value is ignored with basic, replica-weighted canary without traffic routing."
                          format: "int32"
                          type: "integer"
                        stableMetadata:
                          description: "StableMetadata specify labels and annotations which will be attached to the stable pods for\nthe duration which they act as a canary, and will be removed after"
                          properties:
                            annotations:
                              additionalProperties:
                                type: "string"
                              description: "Annotations additional annotations to add to the experiment"
                              type: "object"
                            labels:
                              additionalProperties:
                                type: "string"
                              description: "Labels Additional labels to add to the experiment"
                              type: "object"
                          type: "object"
                        stableService:
                          description: "StableService holds the name of a service which selects pods with stable version and don't select any pods with canary version."
                          type: "string"
                        steps:
                          description: "Steps define the order of phases to execute the canary deployment"
                          items:
                            description: "CanaryStep defines a step of a canary deployment."
