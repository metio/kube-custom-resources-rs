                    type: "object"
                  type: "array"
                terminate:
                  description: "Terminate is used to prematurely stop the experiment"
                  type: "boolean"
              required:
                - "templates"
              type: "object"
            status:
              description: "ExperimentStatus is the status for a Experiment resource"
              properties:
                analysisRuns:
                  description: "AnalysisRuns tracks the status of AnalysisRuns associated with this Experiment"
                  items:
                    properties:
                      analysisRun:
                        description: "AnalysisRun is the name of the AnalysisRun"
                        type: "string"
                      message:
                        description: "Message is a message explaining the current status"
                        type: "string"
                      name:
                        description: "Name is the name of the analysis"
                        type: "string"
                      phase:
                        description: "Phase is the status of the AnalysisRun"
                        type: "string"
                    required:
                      - "analysisRun"
                      - "name"
                      - "phase"
                    type: "object"
                  type: "array"
                availableAt:
                  description: "AvailableAt the time when all the templates become healthy and the experiment should start tracking the time to\nrun for the duration of specificed in the spec."
                  format: "date-time"
                  type: "string"
                conditions:
                  description: "Conditions a list of conditions a experiment can have."
                  items:
                    description: "ExperimentCondition describes the state of a experiment at a certain point."
                    properties:
                      lastTransitionTime:
                        description: "Last time the condition transitioned from one status to another."
                        format: "date-time"
                        type: "string"
                      lastUpdateTime:
                        description: "The last time this condition was updated."
                        format: "date-time"
                        type: "string"
                      message:
                        description: "A human readable message indicating details about the transition."
                        type: "string"
                      reason:
                        description: "The reason for the condition's last transition."
                        type: "string"
                      status:
                        description: "Phase of the condition, one of True, False, Unknown."
                        type: "string"
                      type:
                        description: "Type of deployment condition."
                        type: "string"
                    required:
                      - "lastTransitionTime"
                      - "lastUpdateTime"
                      - "message"
                      - "reason"
                      - "status"
                      - "type"
                    type: "object"
                  type: "array"
                message:
                  description: "Message is an explanation for the current status"
                  type: "string"
                phase:
                  description: "Phase is the status of the experiment. Takes into consideration ReplicaSet degradations and\nAnalysisRun statuses"
                  type: "string"
                templateStatuses:
                  description: "TemplateStatuses holds the ReplicaSet related statuses for individual templates"
                  items:
                    description: "TemplateStatus is the status of a specific template of an Experiment"
                    properties:
                      availableReplicas:
                        description: "Total number of available pods (ready for at least minReadySeconds) targeted by this experiment."
                        format: "int32"
                        type: "integer"
                      collisionCount:
                        description: "CollisionCount count of hash collisions for the Experiment. The Experiment controller uses this\nfield as a collision avoidance mechanism when it needs to create the name for the\nnewest ReplicaSet."
                        format: "int32"
                        type: "integer"
                      lastTransitionTime:
                        description: "LastTransitionTime is the last time the replicaset transitioned, which resets the countdown\non the ProgressDeadlineSeconds check."
                        format: "date-time"
                        type: "string"
                      message:
                        description: "Message is a message explaining the current status"
                        type: "string"
                      name:
                        description: "Name of the template used to identity which hash to compare to the hash"
                        type: "string"
                      podTemplateHash:
                        description: "PodTemplateHash is the value of the Replicas' PodTemplateHash"
                        type: "string"
                      readyReplicas:
                        description: "Total number of ready pods targeted by this experiment."
                        format: "int32"
                        type: "integer"
                      replicas:
                        description: "Total number of non-terminated pods targeted by this experiment (their labels match the selector)."
                        format: "int32"
                        type: "integer"
                      serviceName:
                        description: "ServiceName is the name of the service which corresponds to this experiment"
                        type: "string"
                      status:
                        description: "Phase is the status of the ReplicaSet associated with the template"
                        type: "string"
                      updatedReplicas:
                        description: "Total number of non-terminated pods targeted by this experiment that have the desired template spec."
                        format: "int32"
                        type: "integer"
                    required:
                      - "availableReplicas"
                      - "name"
                      - "readyReplicas"
                      - "replicas"
                      - "updatedReplicas"
                    type: "object"
                  type: "array"
              type: "object"
          required:
            - "spec"
          type: "object"
      served: true
      storage: true
      subresources: {}
